[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mei"
version = "1.0.0.0"
description = "Mei — PyQt5 WebEngine shell with Personal and AI hubs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "PyQtWebEngine>=5.15",
    "cryptography>=41",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The engine Mei ships with, pinned rather than ">=": which Chromium the user
# gets is a product decision, and an unpinned install quietly turns into a
# different browser. Qt 6.11 = Chromium 140 (the 6.8 line was 122). The PyQt5
# fallback pins Qt 5.15, which is Chromium 87 — see docs/reports/qt611-spike.md.
qt6 = ["PyQt6==6.11.0", "PyQt6-WebEngine==6.11.0"]
# Packaging is the other half of the engine: 6.19.0 is what the shipped .exe is
# built with and what the Qt 6.11 spike proved still packages the engine. Bump
# it in its own commit, never in the same one as Qt, or a broken exe has two
# possible causes.
build = ["pyinstaller==6.19.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["litebrowser*"]

# The chain manifest ships with the code so dev and a packaged build read the
# same project chain (see litebrowser/core/app_paths.py).
[tool.setuptools.package-data]
litebrowser = ["data/*.json", "data/plugins/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
