name: CI

# The suite is the project's whole safety net, including the gates that keep the
# layers, the capability ledger and the command registry honest. Until this
# workflow existed it only ever ran on the machine that wrote it.
# Both Qt bindings are exercised: the shipped .exe is built with PyQt6 (the shim
# rewrites PyQt5 imports onto it), while a source checkout often only has PyQt5.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests · ${{ matrix.binding }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # One package per key. A single "PyQt5>=5.15 PyQtWebEngine>=5.15" string
          # reaches pip as ONE requirement no matter how it is quoted (both shells
          # here either split it badly or keep the quotes), and pip then fails
          # before a single test runs. Quoting each expression separately is the
          # shape that works in pwsh and bash alike.
          # PyQt5 is the fallback a source checkout often already has, and it
          # pins Qt 5.15 = Chromium 87: this job is the canary for that branch.
          - binding: PyQt5
            qt_core: "PyQt5>=5.15"
            qt_web: "PyQtWebEngine>=5.15"
          # PyQt6 is the engine the shipped .exe is built on, so this job is
          # pinned to exactly what we ship (Chromium 140). Left unpinned it
          # silently became a beta channel for whatever PyPI published that day,
          # which is how a Qt upgrade used to reach users untested.
          - binding: PyQt6
            qt_core: "PyQt6==6.11.0"
            qt_web: "PyQt6-WebEngine==6.11.0"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      # v5 / v6: the v4 and v5 majors still target Node 20, which runners now
      # force onto Node 24 and report as a deprecation warning on every run.
      # Pinned to the tag's commit so the test environment cannot move silently.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (${{ matrix.binding }})
        # The package is not installed: pytest reads `pythonpath = ["."]` from
        # pyproject.toml, and installing it would drag in PyQt5 on the Qt6 job.
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.qt_core }}" "${{ matrix.qt_web }}" "cryptography>=40.0.0" "segno>=1.6.0" "pytest>=7.0" "ruff>=0.5"

      - name: Engine version
        # Record which Chromium the suite is about to run on. Without this the
        # log of a green run cannot tell Chromium 87 from 140.
        run: python tools/engine_report.py

      - name: Lint (unused imports, shadowed names, dead locals)
        run: python -m ruff check --select F401,F811,F841,F821 litebrowser tests tools

      - name: Both halves of the day
        # Auto day/night reads the wall clock, so a palette assertion can pass
        # here and fail on a runner six hours away (it did: green at 23:xx local,
        # red at 06:2x UTC). Freeze the hour and check the clock-sensitive modules
        # in both directions before the full suite runs.
        run: |
          python tools/run_at_hour.py 10
          python tools/run_at_hour.py 22

      - name: Tests
        # Tee the run into a file so the next step can say *what* failed.
        shell: pwsh
        run: |
          python -m pytest -p no:cacheprovider --no-header -q 2>&1 | Tee-Object -FilePath pytest.log
          exit $LASTEXITCODE

      - name: Report the failing tests
        # A job log needs a token to read, and a red run that explains nothing is
        # useless in a browser. Check-run annotations are public, so the failing
        # test ids are echoed as annotations (GitHub keeps the first ten).
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path pytest.log)) { Write-Output "::error::pytest produced no log"; exit 0 }
          $lines = Get-Content pytest.log
          foreach ($line in ($lines | Where-Object { $_ -match '^(FAILED|ERROR) ' } | Select-Object -First 7)) {
            Write-Output "::error::$line"
          }
          foreach ($line in ($lines | Select-Object -Last 2)) {
            if ($line.Trim()) { Write-Output "::error::summary: $line" }
          }
